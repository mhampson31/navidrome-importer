[package]
name = "navidrome-importer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = "0.4.44"
clap = { version = "4.6", features = ["derive"] }
config = "0.15"
sqlx = { version = "0.8", features = [ "runtime-tokio", "sqlite", "macros", "migrate" ] }
tokio = { version = "1.25", features = ["rt", "macros"]}
